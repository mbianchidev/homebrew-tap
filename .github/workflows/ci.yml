name: Formula

on:
  push:
    branches: [main]
    paths: ["Formula/**"]
  pull_request:
    paths: ["Formula/**"]

permissions:
  contents: read

jobs:
  install:
    name: Install formula (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check formula syntax
        run: ruby -c Formula/sql-not-so-lite.rb

      - name: Install and test published formula
        env:
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          brew tap mbianchidev/tap
          brew style --formula mbianchidev/tap/sql-not-so-lite
          brew install mbianchidev/tap/sql-not-so-lite
          brew test mbianchidev/tap/sql-not-so-lite
