name: Package updates

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Verify available releases without creating branches or pull requests
        type: boolean
        default: true

concurrency:
  group: package-updates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: github.repository == 'mbianchidev/homebrew-tap' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
      UPDATE_GIT_NAME: ${{ github.repository_owner }}
      UPDATE_GIT_EMAIL: ${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preload verified pinned Python through the release asset API
        env:
          TAP_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash scripts/ci/setup-python.sh

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"

      - name: Authenticate branch pushes with the job-scoped token
        if: env.DRY_RUN != 'true'
        run: gh auth setup-git

      - name: Verify stable releases and prepare one CI-gated update batch
        env:
          TAP_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          if [[ "$DRY_RUN" == true ]]; then
            python3 -m scripts.ci.package_updates --dry-run
          else
            python3 -m scripts.ci.package_updates
          fi
